name: Release erstellen

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            arch: x86_64
            binary: dist/Savox76Giveaway.exe
          - os: ubuntu-latest
            platform: linux
            arch: x86_64
            binary: dist/Savox76Giveaway
          - os: macos-14
            platform: macos
            arch: arm64
            binary: dist/Savox76Giveaway
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -e ".[dev]"
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: pytest
      - run: pyinstaller --clean --noconfirm Savox76Giveaway.spec
      - run: python scripts/package_release.py --binary "${{ matrix.binary }}" --platform "${{ matrix.platform }}" --arch "${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-artifacts/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true
      - name: GitHub Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-artifacts/* --generate-notes --verify-tag
